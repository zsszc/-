<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>航迹云 · 链路观测</title>
  <link rel="stylesheet" href="/static/acceptance.css" />
  <style>
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:14px; }
    .wide { grid-column:1/-1; }
    .kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; margin:12px 0; }
    .kpi { border:3px solid var(--ink); background:var(--paper); padding:9px 11px; }
    .kpi span { display:block; color:var(--muted); font-size:11px; }
    .kpi b { display:block; font-size:22px; margin-top:3px; font-variant-numeric:tabular-nums; }
    .trace { display:grid; grid-template-columns:150px 90px 1fr 90px 90px 70px; gap:8px;
      align-items:center; border-top:2px solid var(--ink); padding:9px 2px; font-size:12px; }
    .trace.head { color:var(--muted); border-top:0; font-weight:700; }
    .trace .bad { color:var(--error); font-weight:700; }
    .trace .ok { color:#267334; font-weight:700; }
    .intent { display:inline-block; border:2px solid var(--ink); background:var(--sky); padding:1px 6px; }
    .status-line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .status-line code { word-break:break-all; }
    .rows { display:flex; flex-direction:column; gap:9px; margin-top:12px; }
    .rowbar { display:grid; grid-template-columns:90px 1fr 130px; gap:8px; align-items:center; font-size:12px; }
    .track { height:15px; border:2px solid var(--ink); background:var(--cream); }
    .fill { display:block; height:100%; background:var(--coral); }
    .empty { border:3px dashed var(--ink); background:var(--paper); padding:13px; line-height:1.8; }
    @media(max-width:900px){ .grid{grid-template-columns:1fr}.wide{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}
      .trace{grid-template-columns:1fr 1fr}.trace.head{display:none}.rowbar{grid-template-columns:80px 1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Agent 链路观测</h1>
      <span class="sub">LangGraph Trace · 延迟与 Token · 用户反馈 · 质量趋势</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>
    <div class="tip">页面只展示安全摘要，不复制用户原文和模型完整输入输出。点击 Trace 进入 Langfuse 查看节点级细节。</div>
    <div id="body"><div class="miss">加载中…</div></div>
  </div>
  <div id="toast"></div>
  <script src="/static/admin.js"></script>
  <script src="/static/acceptance.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString("zh-CN");
    const sec = n => Number(n || 0).toFixed(2) + "s";
    function panel(title, lede, wide=false) {
      const p=el("section","panel"+(wide?" wide":"")); p.appendChild(el("h2",null,title));
      p.appendChild(el("p","lede",lede)); return p;
    }
    function kpis(items){ const box=el("div","kpis"); for(const [label,value] of items){
      const k=el("div","kpi"); k.append(el("span",null,label),el("b",null,value)); box.appendChild(k); } return box; }

    function runtimePanel(d){
      const p=panel("近 24 小时运行链路（最多 50 条样本）",
        "每次对话在 Langfuse 中保留 LangGraph 节点、LLM 调用、工具调用、耗时与 token。",true);
      const line=el("div","status-line");
      const labels={online:["在线","ok"],unconfigured:["未配置","missing"],unreachable:["不可达","fail"]};
      const st=labels[d.status]||[d.status,"missing"];
      line.appendChild(el("span","pill "+st[1],st[0]));
      line.appendChild(el("code",null,d.base_url||"LANGFUSE_BASE_URL 未填写")); p.appendChild(line);
      p.appendChild(kpis([["请求数",fmt(d.metrics.requests)],["错误数",fmt(d.metrics.errors)],
        ["平均延迟",sec(d.metrics.avg_latency)],["P95 延迟",sec(d.metrics.p95_latency)],["Token",fmt(d.metrics.total_tokens)]]));
      if(d.note) p.appendChild(el("div","empty",d.note));
      if(d.traces.length){
        const head=el("div","trace head"); ["时间","会话","意图 / 链路","延迟","Token","状态"].forEach(x=>head.appendChild(el("span",null,x))); p.appendChild(head);
        for(const t of d.traces){ const r=el("div","trace");
          r.appendChild(el("span",null,t.timestamp_anomaly?"时间异常":(t.timestamp||"—").replace("T"," ").slice(5,19)));
          r.appendChild(el("span",null,t.session_id?"#"+t.session_id:"—"));
          const mid=el("span"); if(t.intent) mid.appendChild(el("span","intent",t.intent));
          else mid.appendChild(document.createTextNode(t.name||"Agent 调用")); r.appendChild(mid);
          r.appendChild(el("span",null,sec(t.latency))); r.appendChild(el("span",null,fmt(t.tokens)));
          const status=el("span",t.error?"bad":"ok",t.error?"错误":"正常");
          if(t.url){ const a=el("a",null,status.textContent+" ↗"); a.href=t.url; a.target="_blank"; a.rel="noopener"; r.appendChild(a); }
          else r.appendChild(status);
          p.appendChild(r); }
      }
      return p;
    }

    function costPanel(d){ const p=panel("意图成本","按 intent 标签聚合请求数和 token，比较各业务链路的用量；未配置模型单价，不代表实际费用。");
      if(!d.present||!d.rows.length){ p.appendChild(el("div","empty",d.hint||"暂无数据")); }
      else { p.appendChild(kpis([["请求数",fmt(d.total_requests)],["总 Token",fmt(d.total_tokens)]]));
        const rows=el("div","rows"); for(const r of d.rows){ const x=el("div","rowbar"); x.appendChild(el("b",null,r.intent));
          const track=el("div","track"), fill=el("span","fill"); fill.style.width=Math.max(2,r.share*100)+"%"; track.appendChild(fill); x.appendChild(track);
          x.appendChild(el("span",null,Math.round(r.share*100)+"% · "+fmt(r.tokens))); rows.appendChild(x); } p.appendChild(rows); }
      p.appendChild(jobRow([d.job],load,d.make)); return p; }

    function trendPanel(d){ const p=panel("物流检索趋势","30 条物流标注题 · hybrid + 重排。仅统计检索指标；忠实度和库外拒答不在这一轮评估内。");
      if(!d.present){ p.appendChild(el("div","empty",d.hint||"暂无数据")); }
      else { const r=d.runs[0],m=r.metrics||{}; p.appendChild(kpis([["评测轮次",d.runs.length],["样本量",r.dataset_size],
        ["Recall@5",Number(m.recall_at_5).toFixed(3)],["MRR@5",Number(m.mrr_at_5).toFixed(3)],
        ["NDCG@5",Number(m.ndcg_at_5).toFixed(3)]])); }
      p.appendChild(jobRow([d.job],load,d.make)); return p; }

    function calibrationPanel(d){ const p=panel("证据置信度","检索后、生成前的证据闸：阈值越高越保守，减少无证据作答。");
      if(!d.present){ p.appendChild(el("div","empty",d.hint||"暂无校准报告")); }
      else { p.appendChild(kpis([["当前阈值",Number(d.in_use).toFixed(2)],["推荐阈值",Number(d.recommended.threshold||0).toFixed(2)],
        ["可答放行率",Math.round((d.recommended.pass_rate||0)*100)+"%"],["库外漏放率",Math.round((d.recommended.leak_rate||0)*100)+"%"]])); }
      p.appendChild(jobRow([d.job],load,d.make)); return p; }

    async function load(){ const body=$("body"); try{ const d=await api("/api/observability/overview"); const grid=el("div","grid");
      grid.append(runtimePanel(d.runtime),costPanel(d.cost),trendPanel(d.trend),calibrationPanel(d.calibration)); body.replaceChildren(grid);
      }catch(e){ body.replaceChildren(el("div","miss","观测数据读取失败："+e.message)); } }
    mountAdminNav("/observability"); $("refreshBtn").addEventListener("click",load); load();
  </script>
</body>
</html>
