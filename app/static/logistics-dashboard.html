<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航迹云 · 运营概览</title>
<style>body{margin:0;background:#d9edf2;color:#16324f;font:14px ui-sans-serif,system-ui,"PingFang SC",sans-serif}.wrap{max-width:980px;margin:40px auto;padding:34px;background:rgba(255,255,255,.92);border:1px solid rgba(22,50,79,.14);border-radius:24px;box-shadow:0 18px 45px rgba(22,50,79,.2)}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9e6e4;padding-bottom:22px}.brand{font-size:25px;font-weight:850;letter-spacing:-.5px}.back{color:#1769aa;border:1px solid #b8d9df;border-radius:10px;padding:9px 13px;text-decoration:none;font-weight:700}.back:hover{background:#d7f5ee}.eyebrow{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#d7f5ee;color:#1769aa;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:26px 0}.card{border:1px solid #c9dce6;border-radius:16px;padding:18px;background:linear-gradient(145deg,#fff,#eef8fa);box-shadow:0 5px 14px rgba(22,50,79,.08)}.num{font-size:31px;font-weight:850;color:#1769aa;margin:10px 0 4px}.label{color:#71879a;font-size:12px;font-weight:700}.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px}.section-title h3{margin:0}.section-title span{font-size:11px;color:#71879a}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid #c9dce6;border-left:5px solid #58c7c4;border-radius:12px;background:#fff;padding:14px;font-weight:700}.note{color:#71879a;font-size:12px;margin-top:28px;padding-top:16px;border-top:1px dashed #b8d9df}@media(max-width:600px){.wrap{margin:0;min-height:100vh;box-sizing:border-box;border-width:0;border-radius:0;box-shadow:none;padding:24px 18px}.top{align-items:flex-start}.brand{font-size:20px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:13px}.num{font-size:25px}}</style></head>
<body><main class="wrap"><div class="top"><div><div class="brand">航迹云 · 运营概览</div><div class="label">GLOBAL LOGISTICS CONTROL ROOM</div><div class="eyebrow">● 本地演示环境</div></div><a class="back" href="/">返回聊天</a></div><section id="metrics" class="grid"></section><div class="section-title"><h3>已启用能力</h3><span>AGENT TOOLCHAIN</span></div><section id="capabilities" class="list"></section><p class="note">当前指标为本地演示项目状态，不代表真实生产运营数据。</p></main>
<script>const labels={knowledge_sources:"知识库材料",regression_cases:"回归样例",logistics_topics:"物流主题",registered_tools:"核心工具"};fetch("/api/logistics/overview").then(r=>r.json()).then(d=>{const m=d.metrics;document.querySelector("#metrics").innerHTML=Object.entries(labels).map(([k,v])=>`<div class="card"><div class="label">${v}</div><div class="num">${m[k]}</div></div>`).join("")+`<div class="card"><div class="label">Milvus 状态</div><div class="num">${m.milvus.status===\"ready\"?m.milvus.count: \"—\"}</div></div>`;document.querySelector("#capabilities").innerHTML=d.capabilities.map(x=>`<div class="item">✓ ${x}</div>`).join("")}).catch(()=>{document.querySelector("#metrics").textContent="概览暂时无法加载，请检查本地服务。"})</script></body></html>
