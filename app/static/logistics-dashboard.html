<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航迹云 · 运营概览</title>
<style>body{margin:0;background:#cce8ec;color:#173746;font:14px ui-monospace,monospace}.wrap{max-width:980px;margin:40px auto;padding:28px;background:#f8fcfc;border:4px solid #173746;box-shadow:8px 8px #173746}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #58c7c4;padding-bottom:16px}.brand{font-size:22px;font-weight:800}.back{color:#173746}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:24px 0}.card{border:3px solid #173746;padding:16px;background:#edf8f8}.num{font-size:30px;font-weight:800;color:#2878b5;margin:8px 0}.label{color:#6c858d}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.item{border-left:6px solid #58c7c4;background:#fff;padding:12px}.note{color:#6c858d;font-size:12px;margin-top:24px}@media(max-width:600px){.wrap{margin:0;min-height:100vh;box-sizing:border-box;border-width:0;box-shadow:none}}</style></head>
<body><main class="wrap"><div class="top"><div><div class="brand">航迹云 · 运营概览</div><div class="label">GLOBAL LOGISTICS CONTROL ROOM</div></div><a class="back" href="/">返回聊天</a></div><section id="metrics" class="grid"></section><h3>已启用能力</h3><section id="capabilities" class="list"></section><p class="note">当前指标为本地演示项目状态，不代表真实生产运营数据。</p></main>
<script>const labels={knowledge_sources:"知识库材料",regression_cases:"回归样例",logistics_topics:"物流主题",registered_tools:"核心工具"};fetch("/api/logistics/overview").then(r=>r.json()).then(d=>{const m=d.metrics;document.querySelector("#metrics").innerHTML=Object.entries(labels).map(([k,v])=>`<div class="card"><div class="label">${v}</div><div class="num">${m[k]}</div></div>`).join("")+`<div class="card"><div class="label">Milvus 状态</div><div class="num">${m.milvus.status===\"ready\"?m.milvus.count: \"—\"}</div></div>`;document.querySelector("#capabilities").innerHTML=d.capabilities.map(x=>`<div class="item">✓ ${x}</div>`).join("")}).catch(()=>{document.querySelector("#metrics").textContent="概览暂时无法加载，请检查本地服务。"})</script></body></html>
