<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>航迹云 · RAG 检索评测</title>
  <link rel="stylesheet" href="/static/acceptance.css" />
  <link rel="stylesheet" href="/static/admin-shell.css" />
  <style>
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:14px; }
    .metric { padding:16px; }
    .metric small { display:block; color:var(--muted); }
    .metric b { display:block; margin:7px 0; color:var(--coral); font-size:25px; }
    .table-wrap { overflow-x:auto; margin-top:14px; }
    table { width:100%; border-collapse:collapse; min-width:880px; }
    th, td { padding:11px 10px; text-align:right; border-bottom:1px solid rgba(22,50,79,.12); }
    th:first-child, td:first-child { text-align:left; font-weight:700; }
    tr.active { background:rgba(84,187,172,.12); }
    .defs { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:12px; }
    .defs div { padding:12px; border-radius:12px; background:var(--cream); }
    .defs b { display:block; margin-bottom:4px; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><h1>RAG 检索评测</h1><span class="sub">传统检索指标 + 端到端行为抽测</span><span class="spacer"></span><button class="btn" id="refresh">刷新</button></div>
    <div id="content"><div class="panel">加载当前物流评测数据…</div></div>
  </main>
  <script src="/static/admin.js"></script>
  <script>
    mountAdminNav("/rag-eval");
    const $ = (id) => document.getElementById(id);
    const LABEL = {vector:"纯向量", bm25:"BM25", hybrid:"混合检索", hybrid_rerank:"混合 + 重排"};
    const pct = (value) => value === null || value === undefined ? "—" : `${(value * 100).toFixed(1)}%`;
    const esc = (value) => String(value ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    function metric(value, label, note) { return `<div class="metric"><small>${label}</small><b>${value}</b><span>${note}</span></div>`; }
    function render(data) {
      if (!data.present) { $("content").innerHTML = `<div class="panel"><h2>尚无检索报告</h2><p>${esc(data.hint)}</p><code>${esc(data.make)}</code></div>`; return; }
      const meta = data.meta, active = data.retrieval.hybrid_rerank?.overall || {};
      const rows = Object.entries(data.retrieval).map(([name, item]) => {
        const x = item.overall || {};
        return `<tr class="${name === "hybrid_rerank" ? "active" : ""}"><td>${LABEL[name] || esc(name)}</td><td>${pct(x.hit_rate_at_1)}</td><td>${pct(x.precision_at_1)}</td><td>${pct(x.precision_at_3)}</td><td>${pct(x.precision_at_5)}</td><td>${pct(x.recall_at_1)}</td><td>${pct(x.recall_at_3)}</td><td>${pct(x.recall_at_5)}</td><td>${pct(x.mrr_at_5)}</td><td>${pct(x.ndcg_at_5)}</td></tr>`;
      }).join("");
      const behavior = data.behavior || {};
      $("content").innerHTML = `<div class="grid">
        ${metric(meta.samples, "检索评测题", `${meta.single_samples} 单证据 + ${meta.multi_samples} 跨文档`)}
        ${metric(meta.relevant_sections, "相关知识小节", `Top-${meta.top_k} 检索`)}
        ${metric(pct(active.recall_at_5), "生产策略 Recall@5", "混合检索 + 重排")}
        ${metric(pct(active.ndcg_at_5), "生产策略 NDCG@5", "越接近 100% 排序越理想")}
      </div>
      <div class="panel"><h2>四策略传统检索指标</h2><p class="lede">绿色行是线上使用的混合检索 + 重排；指标来自固定 ground truth，不使用 LLM 裁判。</p><div class="table-wrap"><table><thead><tr><th>策略</th><th>Hit@1</th><th>P@1</th><th>P@3</th><th>P@5</th><th>R@1</th><th>R@3</th><th>R@5</th><th>MRR@5</th><th>NDCG@5</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">生成时间：${esc(meta.generated_at)}</p></div>
      <div class="panel"><h2>指标口径</h2><div class="defs">${Object.entries(data.definitions).map(([key, value]) => `<div><b>${esc(key.replaceAll("_", " ").toUpperCase())}</b><span>${esc(value)}</span></div>`).join("")}</div></div>
      <div class="panel"><h2>端到端 Agent 行为抽测</h2><p class="lede">与检索指标分开统计，检查工具、拒答、澄清和证据行为。</p><div class="grid">${metric(behavior.total || "—", "在线样本", `${behavior.passed || 0} 条通过`)}${metric(pct(behavior.pass_rate), "行为通过率", "不是检索准确率")}</div></div>`;
    }
    async function load() { try { const r = await fetch("/api/rag-eval/overview"); if (!r.ok) throw new Error("评测接口不可用"); render(await r.json()); } catch (e) { $("content").innerHTML = `<div class="panel">读取失败：${esc(e.message)}</div>`; } }
    $("refresh").addEventListener("click", load); load();
  </script>
</body>
</html>
