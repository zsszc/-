<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运单详情 · 航迹云</title>
  <style>
    :root { --navy:#16324f; --blue:#1769aa; --teal:#8de0d3; --paper:#f6fbfc; --line:#c8dce3; --muted:#5e7484; --danger:#b54b45; }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#eff8f9,#fff); color:var(--navy); font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif; }
    main { max-width:1040px; margin:0 auto; padding:28px 18px 56px; } header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(24px,4vw,38px); letter-spacing:-.04em; } a { color:var(--blue); font-weight:700; text-decoration:none; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .panel,.card { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 30px #16324f12; }
    .panel { padding:18px; display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; } label { display:grid; gap:5px; color:var(--muted); font-size:13px; font-weight:700; }
    input,button { border:1px solid var(--line); border-radius:10px; min-height:42px; padding:0 12px; font:inherit; } input:focus { outline:3px solid #8de0d355; border-color:var(--blue); }
    button { border:0; background:var(--navy); color:#fff; cursor:pointer; font-weight:800; padding:0 20px; } button:hover { background:var(--blue); }
    #message { min-height:24px; margin:14px 2px; color:var(--danger); font-weight:700; } #message.ok { color:#26745f; }
    .result { display:none; gap:16px; } .result.show { display:grid; } .hero { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; padding:22px; }
    .status { display:inline-flex; background:var(--teal); border-radius:999px; padding:4px 12px; font-weight:800; } .meta { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:18px; }
    .metric { padding:12px; border-radius:12px; background:var(--paper); } .metric small { display:block; color:var(--muted); } .metric strong { display:block; margin-top:3px; }
    .content { display:grid; grid-template-columns:1.25fr .75fr; gap:16px; } .card { padding:20px; } .card h2 { margin:0 0 16px; font-size:18px; }
    .timeline { list-style:none; padding:0 0 0 12px; margin:0; border-left:2px solid var(--teal); } .event { position:relative; padding:0 0 20px 20px; } .event:last-child { padding-bottom:0; }
    .event::before { content:""; position:absolute; left:-20px; top:5px; width:10px; height:10px; border:3px solid #fff; border-radius:50%; background:var(--line); box-shadow:0 0 0 2px var(--line); }
    .event.done::before { background:var(--blue); box-shadow:0 0 0 2px var(--blue); } .event.current strong { color:var(--blue); } .event time { display:block; color:var(--muted); font-size:12px; }
    .exception { background:#fff4ef; border-color:#f0c5b7; } .empty { color:var(--muted); } @media (max-width:700px) { header,.hero { display:block; } header a { display:inline-block; margin-top:10px; } .panel,.meta,.content { grid-template-columns:1fr; } button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">Cross-border operations</div><h1>运单详情</h1></div><a href="/">← 返回聊天</a></header>
    <form class="panel" id="query-form">
      <label>运单号<input id="tracking-no" value="CNDE20260917001" required /></label>
      <label>用户标识<input id="user-id" value="demo-user" required /></label>
      <button type="submit">查询运单</button>
    </form>
    <div id="message" role="status"></div>
    <section class="result" id="result" aria-live="polite"></section>
  </main>
  <script>
    const form = document.getElementById("query-form"), message = document.getElementById("message"), result = document.getElementById("result");
    const esc = value => String(value ?? "—").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    function render(data) {
      const events = (data.events || []).map(event => `<li class="event ${event.completed ? "done" : ""} ${event.status === data.status ? "current" : ""}"><strong>${esc(event.status)} · ${esc(event.location)}</strong><time>${esc(event.occurred_at)}</time><span>${esc(event.description)}</span></li>`).join("");
      const exception = data.exception_code ? `<div class="card exception"><h2>异常提示</h2><strong>${esc(data.exception_code)}</strong><p>当前节点需要继续关注，建议结合承运商通知准备补充材料。</p></div>` : `<div class="card"><h2>运营提示</h2><p class="empty">当前未标记异常，继续关注下一运输节点。</p></div>`;
      result.innerHTML = `<div class="card hero"><div><div class="eyebrow">${esc(data.carrier)} · ${esc(data.service_level)}服务</div><h2>${esc(data.tracking_no)}</h2><span class="status">${esc(data.status)}</span></div><div><strong>${esc(data.origin)} → ${esc(data.destination)}</strong><br><span class="empty">预计送达：${esc(data.estimated_delivery)}</span></div></div><div class="card meta"><div class="metric"><small>当前节点</small><strong>${esc(data.current_node)}</strong></div><div class="metric"><small>最后更新</small><strong>${esc(data.last_update)}</strong></div><div class="metric"><small>SLA 截止</small><strong>${esc(data.sla_due_at)}</strong></div><div class="metric"><small>异常码</small><strong>${esc(data.exception_code || "无")}</strong></div></div><div class="content"><div class="card"><h2>运输轨迹</h2><ol class="timeline">${events}</ol></div>${exception}</div>`;
      result.classList.add("show"); message.textContent = "查询成功，数据来自本地演示运单。"; message.className = "ok";
    }
    form.addEventListener("submit", async event => { event.preventDefault(); result.classList.remove("show"); message.textContent = "正在查询…"; message.className = ""; try { const response = await fetch("/api/logistics/shipment-query", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({tracking_no:document.getElementById("tracking-no").value.trim(), user_id:document.getElementById("user-id").value.trim()}) }); const data = await response.json(); if (!response.ok) throw new Error(data.detail || "查询失败"); render(data); } catch (error) { message.textContent = error.message || "查询失败，请稍后重试。"; } });
    form.dispatchEvent(new Event("submit"));
  </script>
</body>
</html>
